# Nested rootless podman inside the bubblewrap sandbox.
#
# The sandbox runs in its own cgroup namespace with a read-only /sys, so there
# is no cgroup delegation: cgroups are disabled entirely (no resource limits).
# There is no /dev/net/tun either, so pasta/slirp4netns cannot create private
# container networks; containers share the sandbox network namespace instead
# (which also means --no-net cuts them off).

[containers]
cgroups = "disabled"
netns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
