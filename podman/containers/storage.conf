# @GRAPHROOT@ and @RUNROOT@ are substituted by sandbox.sh.
#
# The sandbox maps a single uid, so image layers owned by other uids cannot be
# chowned; ignore_chown_errors keeps such images usable (all files end up
# owned by root inside the container).

[storage]
driver = "overlay"
graphroot = "@GRAPHROOT@"
runroot = "@RUNROOT@"

[storage.options.overlay]
ignore_chown_errors = "true"
